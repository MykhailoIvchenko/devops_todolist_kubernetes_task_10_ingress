apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-task
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
    - http:
        paths:
          - pathType: Prefix
            path: /todoapp(/|$)(.*)
            backend:
              service:
                name: todoapp-service
                port:
                  number: 80
